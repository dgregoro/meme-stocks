# Production compose: uses image from GitHub Container Registry (GHCR).
# Used on the VPS for manual restarts or as reference; CI/CD runs podman directly.
# Create /opt/meme-stocks/.env with REDDIT_* and other vars (see docs/DEPLOYMENT.md).

services:
  backend:
    image: ghcr.io/REPLACE_OWNER/meme-stocks:latest
    container_name: meme-stocks-backend
    ports:
      - "8000:8000"
    volumes:
      - meme-stocks-data:/app/data
    env_file:
      - /opt/meme-stocks/.env
    environment:
      - PYTHONPATH=/app
      # /app/data/app.db in-container (WORKDIR /app).
      - DATABASE_URL=sqlite:///./data/app.db
      - SERVING_FRONTEND=true
    restart: unless-stopped

volumes:
  meme-stocks-data:
    name: meme-stocks-data
