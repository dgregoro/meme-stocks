name: Security and Dependency Hygiene

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 2 * * 1"  # Mondays at 02:00 UTC

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (requirements)
        run: |
          pip-audit -r backend/requirements.txt --progress-spinner=off

      - name: Bandit (security lint)
        run: |
          bandit -r backend -x backend/tests -q


