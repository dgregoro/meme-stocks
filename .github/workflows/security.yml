name: Security and Dependency Hygiene

# Run on PRs (avoids duplicate with push when both fire for same commit).
# Run on push to default branch only (merge, direct pushes).
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * 1"  # Mondays at 02:00 UTC

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (requirements)
        run: |
          # pygments: requirements use patched GitHub tarball (post-PR#3064, CVE-2026-4539); PyPI
          # still only ships 2.19.2 and pip-audit matches the reported version string. Drop
          # --ignore-vuln when pygments>=2.19.3 is published.
          pip-audit -r backend/requirements.txt --progress-spinner=off --ignore-vuln CVE-2026-4539

      - name: Bandit (security lint)
        run: |
          bandit -r backend -x backend/tests -q
