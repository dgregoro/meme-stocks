name: CI - Lint and Test

# Runs after Security passes (workflow_run) so pipeline order is: Security → CI → Deploy.
on:
  workflow_run:
    workflows: ["Security and Dependency Hygiene"]
    types:
      - completed
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pre-commit types-requests

      - name: Run pre-commit (all files)
        run: |
          pre-commit run --all-files

      - name: Run mypy
        run: |
          MYPYPATH=. python -m mypy -p backend.app -p backend.tests

      - name: Run pytest with coverage
        run: |
          pytest backend/tests/ -q --cov=backend/app --cov-report=term --cov-config=pyproject.toml

  frontend-build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    container: fedora:latest
    timeout-minutes: 10
    steps:
      - name: Install git and lsb_release
        run: dnf install -y git lsb_release
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
