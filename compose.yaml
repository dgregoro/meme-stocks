# Meme Stocks - Development and Production Compose
#
# Development:  podman-compose up
#   - Backend: rebuild image to apply changes (podman-compose up --build)
#   - Frontend: served from container (or use --profile dev for Vite HMR)
#   - Data: persisted in ./data
#
# With frontend dev server (HMR):  podman-compose --profile dev up
# Production (portable, no mounts):  podman run -p 8000:8000 -v meme-stocks-data:/app/data meme-stocks:latest
#
# Note: --reload is disabled; watchfiles fails with PermissionError on rootless Podman volume mounts.

services:
  backend:
    build:
      context: .
      dockerfile: Containerfile
    image: meme-stocks:latest
    container_name: meme-stocks-backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      # Backend mount disabled: rootless Podman bind-mount causes ModuleNotFoundError for backend.app.
      # For local edits, run backend locally: uvicorn backend.app.main:app --host 127.0.0.1 --port 8000
      # - ./backend:/app/backend
      # Persist SQLite database and data
      - meme-stocks-data:/app/data
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # If you change deployment/.env, recreate so variables are picked up:
    #   podman compose up -d --force-recreate backend
    env_file:
      - deployment/.env
    environment:
      - PYTHONPATH=/app
      # LOG_FILE=data/logs/app.log  # uncomment to persist yfinance logs in data volume
      - DATABASE_URL=sqlite:///./data/app.db
      - SERVING_FRONTEND=true
    # Reddit credentials: deployment/.env (env_file above)
    restart: unless-stopped

  # Frontend dev server - only needed when editing frontend locally
  # Run: podman-compose --profile dev up
  # Access app at http://localhost:5173 (frontend) with HMR
  frontend-dev:
    image: node:20
    container_name: meme-stocks-frontend-dev
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    profiles:
      - dev
    depends_on:
      - backend

volumes:
  meme-stocks-data:
    name: meme-stocks-data
